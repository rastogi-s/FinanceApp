# Checks every pull request and every push to main:
#   backend   lint, format and unit tests for the FastAPI app (against a real Postgres), plus pip-audit
#   frontend  lint, type check and build of the Next.js app, plus npm audit
#   scripts   shellcheck on update.sh and the test scripts
#   image     builds the Docker image, scans it and the Dockerfile/Compose file with Trivy, starts it with Postgres
#             in demo mode and runs the smoke test (every page at laptop and phone size, light and dark, with an
#             accessibility check; screenshots are attached to the run), then starts it for real (not demo) and runs
#             the flow test: first-run setup, code app, passkey, file uploads, recategorizing, inviting, signing
#             out and back in. Then tests update.sh end to end.
# CodeQL runs separately (codeql.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: finance_test
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: ci-only-password
        ports: ["127.0.0.1:5432:5432"]
        options: --health-cmd "pg_isready -U finance" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://finance:ci-only-password@127.0.0.1:5432/finance_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install uv==0.11.32
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Fails on high or critical problems in what ships to the browser. Build tools are reported, not gating.
      - name: Audit dependencies for known vulnerabilities
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high || echo "::warning::npm audit found issues in build-only dependencies"

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: shellcheck update.sh e2e/update-test.sh

  image:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      FINANCEAPP_IMAGE: financeapp
      FINANCEAPP_VERSION: ci
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          load: true
          tags: financeapp:ci
          build-args: APP_VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: financeapp:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the Dockerfile and Compose file for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Start the app in demo mode with Postgres
        run: |
          docker compose up -d --wait --wait-timeout 120
          curl -fsS http://localhost:8080/health
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Chromium
        working-directory: e2e
        run: npm ci --no-fund && npx playwright install --with-deps chromium
      - name: Open every page on a laptop and a phone
        working-directory: e2e
        run: node smoke.mjs
      - name: Go back and land where you were
        working-directory: e2e
        run: node back.mjs
      - name: Attach the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: e2e/smoke-results/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs
      - name: Stop the demo
        run: docker compose down -v
      - name: Start the app for real (no sample data)
        env:
          DEMO_MODE: "false"
        run: |
          ENCRYPTION_KEY=$(openssl rand -base64 32) docker compose up -d --wait --wait-timeout 120
          curl -fsS http://localhost:8080/health | grep -q '"encryption_key":"ok"'
      - name: Set up, sign in, upload, recategorize, invite, sign out and back in
        working-directory: e2e
        run: |
          SETUP_CODE=$(docker compose -f ../docker-compose.yml logs app | grep -o '[A-Z0-9]\{4\}-[A-Z0-9]\{4\}-[A-Z0-9]\{4\}' | tail -1)
          SETUP_CODE=$SETUP_CODE node flow.mjs
      - name: Attach the flow screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flow-screenshots
          path: e2e/flow-results/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs
      - name: Stop the app
        run: docker compose down -v
      - name: Test update.sh (install, update with backup, rollback, restore)
        run: |
          sudo apt-get install -y -qq age
          e2e/update-test.sh financeapp:ci
