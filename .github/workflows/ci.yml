# Checks every pull request and every push to main:
#   backend   lint, format and unit tests for the FastAPI app, plus pip-audit
#   frontend  lint, type check and build of the Next.js app, plus npm audit
#   scripts   shellcheck on update.sh and the test scripts
#   image     builds the Docker image, scans it and the Dockerfile/Compose file with Trivy, starts it with Postgres
#             in demo mode and runs the smoke test (every page at laptop and phone size, light and dark, with an
#             accessibility check; screenshots are attached to the run), then tests update.sh end to end.
# CodeQL runs separately (codeql.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install uv==0.11.32
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Fails on high or critical problems in what ships to the browser. Build tools are reported, not gating.
      - name: Audit dependencies for known vulnerabilities
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high || echo "::warning::npm audit found issues in build-only dependencies"

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: shellcheck update.sh e2e/update-test.sh

  image:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      FINANCEAPP_IMAGE: financeapp
      FINANCEAPP_VERSION: ci
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          load: true
          tags: financeapp:ci
          build-args: APP_VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: financeapp:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the Dockerfile and Compose file for misconfigurations
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Start the app in demo mode with Postgres
        run: |
          docker compose up -d --wait --wait-timeout 120
          curl -fsS http://localhost:8080/health
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Chromium
        working-directory: e2e
        run: npm ci --no-fund && npx playwright install --with-deps chromium
      - name: Open every page on a laptop and a phone
        working-directory: e2e
        run: node smoke.mjs
      - name: Attach the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: e2e/smoke-results/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs
      - name: Stop the app
        run: docker compose down -v
      - name: Test update.sh (install, update with backup, rollback, restore)
        run: |
          sudo apt-get install -y -qq age
          e2e/update-test.sh financeapp:ci
