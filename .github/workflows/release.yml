# Runs automatically after every merge to main (see auto-release.yml), or by hand:  git tag v1.1.0 && git push origin v1.1.0
# Tests the app, builds the Docker image for Intel/AMD and ARM servers, pushes it to ghcr.io (tags 1.2.3, 1.2 and
# latest), signs it with cosign (update.sh refuses an image without this signature), and creates a GitHub Release
# with notes from whats-new.json. Tags with a suffix (v1.3.0-beta.1) become pre-releases: they don't move
# "latest", so servers only get them when asked for by name (./update.sh 1.3.0-beta.1).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Version tag to build and publish, e.g. v1.2.3
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install uv==0.11.32
      - working-directory: backend
        run: uv sync --frozen && uv run pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/financeapp
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          # The version label must be the bare version (1.2.3); update.sh reads it.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: sigstore/cosign-installer@v4
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/financeapp
        run: cosign sign --yes "$IMAGE@$DIGEST"

  release:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Release notes from whats-new.json
        id: notes
        env:
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          V="${TAG#v}"; V="${V%%-*}"
          TITLE=$(jq -r --arg v "$V" '.[] | select(.version == $v) | .title // empty' backend/financeapp/data/whats-new.json)
          echo "name=Finance App ${TAG#v}${TITLE:+: $TITLE}" >> "$GITHUB_OUTPUT"
          {
            jq -r --arg v "$V" '.[] | select(.version == $v) | .features[] | "**" + .title + ".** " + .body + "\n"' \
              backend/financeapp/data/whats-new.json
            echo "To install it on your server: \`./update.sh\` (or wait for the nightly update)."
            echo
            echo "Image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/financeapp:${TAG#v}\` (\`${DIGEST}\`), signed with cosign."
          } > release-notes.md
          cat release-notes.md
      - name: Collect the server files
        run: |
          mkdir -p release
          cp docker-compose.yml update.sh .env.example release/
          cp deploy/systemd/* release/
          (cd release && sha256sum -- * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: release/*
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
