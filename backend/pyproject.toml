[project]
name = "financeapp"
version = "0.0.0"  # the release version comes from the image (APP_VERSION), not from here
description = "Private, read-only household finance app"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.150.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.5",
    "psycopg[binary]==3.3.6",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "pyotp==2.10.0",
    "webauthn==3.0.1",
    "alembic==1.20.0",
    "httpx==0.28.1",
    "segno==1.6.6",
    "python-multipart==0.0.32",
    "pypdf==6.21.1",
    "pillow==13.0.0",
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.15.1",
    "ruff==0.17.1",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["financeapp"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
